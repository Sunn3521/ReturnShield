version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: src/Dockerfile
    container_name: returnshield-api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    restart: always

  ui:
    build:
      context: ..
      dockerfile: src/Dockerfile
    container_name: returnshield-ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: always
